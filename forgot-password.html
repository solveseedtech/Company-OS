<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · Solve Seeds Technologies</title>
  <meta name="description" content="Reset your Solve Seeds portal password.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314110C'/><text x='50' y='65' font-family='sans-serif' font-size='42' font-weight='900' fill='%23FDFBF7' text-anchor='middle'>SS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 32px 16px;
    }
  </style>
</head>
<body>

  <main class="auth-card-claude" role="main">
    <div class="auth-brand-mark">SS</div>
    <h1 class="auth-heading-serif">Reset Password</h1>
    <p class="auth-subhead">Enter your account email to receive a secure recovery link</p>

    <form id="forgotForm" onsubmit="handleForgotSubmit(event)" novalidate>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label class="field-label" for="forgotEmail">Email</label>
          <input type="email" id="forgotEmail" class="field-input" placeholder="name@company.com" required autocomplete="email">
          <div id="emailError" class="field-inline-error" style="display:none;"></div>
        </div>

        <div id="forgotInlineStatus" style="display:none; font-size:13px; padding:10px 14px; border-radius:var(--r-xs); line-height:1.4;"></div>

        <button type="submit" id="submitBtn" class="btn btn-dark btn-claude-submit">
          Send Recovery Link
        </button>
      </div>
    </form>

    <div class="auth-divider-hairline"></div>

    <div class="auth-secondary-action">
      Remembered your password? <a href="login.html">Sign in</a>
    </div>
  </main>

  <script>
    async function handleForgotSubmit(e) {
      e.preventDefault();
      const emailInput = document.getElementById('forgotEmail');
      const emailErr = document.getElementById('emailError');
      const statusEl = document.getElementById('forgotInlineStatus');
      const submitBtn = document.getElementById('submitBtn');

      emailErr.style.display = 'none';
      statusEl.style.display = 'none';

      const email = (emailInput.value || '').trim();
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        emailErr.textContent = 'Please enter a valid email address.';
        emailErr.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Sending…';

      try {
        const resp = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await resp.json().catch(() => ({}));

        statusEl.textContent = (data && data.message) || 'If an account exists for this email, password reset instructions have been sent.';
        statusEl.style.color = 'var(--color-success)';
        statusEl.style.background = '#EBF1EC';
        statusEl.style.border = '1px solid #C7DEC9';
        statusEl.style.display = 'block';
      } catch (err) {
        statusEl.textContent = 'If an account exists for this email, password reset instructions have been sent.';
        statusEl.style.color = 'var(--color-success)';
        statusEl.style.background = '#EBF1EC';
        statusEl.style.border = '1px solid #C7DEC9';
        statusEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Send Recovery Link';
      }
    }
  </script>
</body>
</html>
