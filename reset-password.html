<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password · Solve Seeds Technologies</title>
  <meta name="description" content="Set a new password for your Solve Seeds account.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314110C'/><text x='50' y='65' font-family='sans-serif' font-size='42' font-weight='900' fill='%23FDFBF7' text-anchor='middle'>SS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 32px 16px;
    }
  </style>
</head>
<body>

  <main class="auth-card-claude" role="main">
    <div class="auth-brand-mark">SS</div>
    <h1 class="auth-heading-serif">Set New Password</h1>
    <p class="auth-subhead">Enter your new secure account password</p>

    <form id="resetForm" onsubmit="handleResetSubmit(event)" novalidate>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label class="field-label" for="resetPassword">New Password</label>
          <div style="position:relative;">
            <input type="password" id="resetPassword" class="field-input" placeholder="••••••••••••" required autocomplete="new-password" style="padding-right:54px;">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('resetPassword', this)">Show</button>
          </div>
          <div id="resetPasswordError" class="field-inline-error" style="display:none;"></div>
        </div>

        <div>
          <label class="field-label" for="resetConfirmPassword">Confirm New Password</label>
          <div style="position:relative;">
            <input type="password" id="resetConfirmPassword" class="field-input" placeholder="••••••••••••" required autocomplete="new-password" style="padding-right:54px;">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('resetConfirmPassword', this)">Show</button>
          </div>
          <div id="resetConfirmError" class="field-inline-error" style="display:none;"></div>
        </div>

        <div id="resetInlineError" class="auth-inline-danger" style="display:none;"></div>
        <div id="resetInlineSuccess" style="display:none; font-size:13px; color:var(--color-success); background:#EBF1EC; border:1px solid #C7DEC9; padding:10px 14px; border-radius:var(--r-xs);"></div>

        <button type="submit" id="submitBtn" class="btn btn-dark btn-claude-submit">
          Update Password
        </button>
      </div>
    </form>

    <div class="auth-divider-hairline"></div>

    <div class="auth-secondary-action">
      Back to <a href="login.html">Sign in</a>
    </div>
  </main>

  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const pwdInput = document.getElementById('resetPassword');
      const confirmInput = document.getElementById('resetConfirmPassword');
      const pwdErr = document.getElementById('resetPasswordError');
      const confirmErr = document.getElementById('resetConfirmError');
      const inlineErr = document.getElementById('resetInlineError');
      const successEl = document.getElementById('resetInlineSuccess');
      const submitBtn = document.getElementById('submitBtn');

      pwdErr.style.display = 'none';
      confirmErr.style.display = 'none';
      inlineErr.style.display = 'none';
      successEl.style.display = 'none';

      const password = pwdInput.value || '';
      const confirm = confirmInput.value || '';

      let hasErr = false;
      if (!password || password.length < 10 || !/[A-Za-z]/.test(password) || !/[0-9]/.test(password)) {
        pwdErr.textContent = 'Password must be at least 10 characters and contain a letter and a number.';
        pwdErr.style.display = 'block';
        hasErr = true;
      }

      if (password !== confirm) {
        confirmErr.textContent = 'Passwords do not match.';
        confirmErr.style.display = 'block';
        hasErr = true;
      }

      if (hasErr) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      setTimeout(() => {
        successEl.textContent = 'Password updated successfully. Redirecting to login…';
        successEl.style.display = 'block';
        setTimeout(() => {
          window.location.href = 'login.html';
        }, 1200);
      }, 400);
    }
  </script>
</body>
</html>
