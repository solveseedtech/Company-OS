<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account · Solve Seeds Technologies</title>
  <meta name="description" content="Create your Solve Seeds client account.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314110C'/><text x='50' y='65' font-family='sans-serif' font-size='42' font-weight='900' fill='%23FDFBF7' text-anchor='middle'>SS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 80px 16px 32px;
    }
  </style>
</head>
<body>

  <!-- Website Header Navigation -->
  <header class="auth-site-header">
    <div class="auth-site-header-inner">
      <a href="index.html" class="brand" title="Solve Seeds Technologies">
        <div class="brand-icon">SS</div>
        <span class="brand-name">Solve Seeds</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">&larr; Back to Website</a>
    </div>
  </header>

  <main class="auth-card-claude" role="main">
    <!-- 1. Small "SS" mark, centered, 32px -->
    <div class="auth-brand-mark">SS</div>

    <!-- 2. Heading, centered: "Welcome to Solve Seeds" -->
    <h1 class="auth-heading-serif">Welcome to Solve Seeds</h1>

    <!-- 3. Subhead below, centered, 14px -->
    <p class="auth-subhead">Create your account</p>

    <!-- 4. Form fields, vertical stack, 16px gaps -->
    <form id="signupForm" onsubmit="handleSignupSubmit(event)" novalidate>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <div>
          <label class="field-label" for="signupName">Full Name</label>
          <input type="text" id="signupName" class="field-input" placeholder="e.g. Siddharth Mehta" autocomplete="name">
        </div>

        <div>
          <label class="field-label" for="signupEmail">Work Email</label>
          <input type="email" id="signupEmail" class="field-input" placeholder="name@company.com" required autocomplete="email">
          <div id="emailError" class="field-inline-error" style="display:none;"></div>
        </div>

        <div>
          <label class="field-label" for="signupPassword">Password</label>
          <div class="password-field-wrap">
            <input type="password" id="signupPassword" class="field-input" placeholder="At least 6 characters" required autocomplete="new-password" oninput="updatePasswordStrength(this.value)">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signupPassword', this)">Show</button>
          </div>
          <!-- Subtle 2px password strength bar under field -->
          <div class="password-strength-bar">
            <div id="strengthFill" class="password-strength-fill"></div>
          </div>
          <div id="passwordError" class="field-inline-error" style="display:none;"></div>
        </div>

        <div>
          <label class="field-label" for="signupConfirmPassword">Confirm password</label>
          <div class="password-field-wrap">
            <input type="password" id="signupConfirmPassword" class="field-input" placeholder="Repeat password" required autocomplete="new-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('signupConfirmPassword', this)">Show</button>
          </div>
          <div id="confirmError" class="field-inline-error" style="display:none;"></div>
        </div>

        <!-- Inline Error Message above button (13px, --color-danger) -->
        <div id="signupInlineError" class="auth-inline-danger" style="display:none;"></div>

        <!-- 6. Primary submit button, full-width, solid ink, 12px radius -->
        <button type="submit" id="submitBtn" class="btn btn-dark btn-claude-submit">
          Create Account
        </button>
      </div>
    </form>

    <!-- 7. Divider hairline -->
    <div class="auth-divider-hairline"></div>

    <!-- 8. Secondary action, centered, 13px -->
    <div class="auth-secondary-action">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </main>

  <script src="js/neon-auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function updatePasswordStrength(val) {
      const fill = document.getElementById('strengthFill');
      if (!fill) return;
      if (!val) {
        fill.style.width = '0%';
        return;
      }
      let score = 0;
      if (val.length >= 6) score += 30;
      if (val.length >= 10) score += 20;
      if (/[A-Za-z]/.test(val)) score += 25;
      if (/[0-9]/.test(val)) score += 25;

      fill.style.width = score + '%';
      if (score < 50) {
        fill.style.backgroundColor = 'var(--color-danger)';
      } else if (score < 80) {
        fill.style.backgroundColor = 'var(--color-warn)';
      } else {
        fill.style.backgroundColor = 'var(--color-success)';
      }
    }

    function formatNameFromEmail(email) {
      const localPart = (email || '').split('@')[0];
      return localPart
        .split(/[._-]/)
        .filter(Boolean)
        .map(p => p.charAt(0).toUpperCase() + p.slice(1).toLowerCase())
        .join(' ') || 'Client';
    }

    async function handleSignupSubmit(e) {
      e.preventDefault();
      const nameInput = document.getElementById('signupName');
      const emailInput = document.getElementById('signupEmail');
      const pwdInput = document.getElementById('signupPassword');
      const confirmInput = document.getElementById('signupConfirmPassword');
      const inlineErr = document.getElementById('signupInlineError');
      const emailErr = document.getElementById('emailError');
      const pwdErr = document.getElementById('passwordError');
      const confirmErr = document.getElementById('confirmError');
      const submitBtn = document.getElementById('submitBtn');

      inlineErr.style.display = 'none';
      emailErr.style.display = 'none';
      pwdErr.style.display = 'none';
      confirmErr.style.display = 'none';

      const email = (emailInput.value || '').trim().toLowerCase();
      const password = pwdInput.value || '';
      const confirm = confirmInput.value || '';
      const rawName = (nameInput ? nameInput.value : '').trim();
      const clientName = rawName || formatNameFromEmail(email);

      let hasErr = false;
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (!email || !emailRegex.test(email)) {
        emailErr.textContent = 'Please enter a valid email address.';
        emailErr.style.display = 'block';
        hasErr = true;
      }

      if (!password) {
        pwdErr.textContent = 'Password is required.';
        pwdErr.style.display = 'block';
        hasErr = true;
      } else if (password.length < 6) {
        pwdErr.textContent = 'Password must be at least 6 characters.';
        pwdErr.style.display = 'block';
        hasErr = true;
      }

      if (password !== confirm) {
        confirmErr.textContent = 'Passwords do not match.';
        confirmErr.style.display = 'block';
        hasErr = true;
      }

      if (hasErr) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating Account…';

      try {
        const result = await neonAuth.signUp({
          email,
          password,
          name: clientName
        });

        if (result && result.ok) {
          submitBtn.textContent = 'Account Created! Redirecting…';
          setTimeout(() => {
            window.location.href = 'portal.html';
          }, 350);
        } else {
          inlineErr.textContent = (result && result.error) || 'Account creation failed. Please try again.';
          inlineErr.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      } catch (err) {
        inlineErr.textContent = 'Authentication service encountered an unexpected error.';
        inlineErr.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    }
  </script>
</body>
</html>
