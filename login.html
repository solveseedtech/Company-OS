<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · Solve Seeds Technologies</title>
  <meta name="description" content="Sign in to your Solve Seeds client portal.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%2314110C'/><text x='50' y='65' font-family='sans-serif' font-size='42' font-weight='900' fill='%23FDFBF7' text-anchor='middle'>SS</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/main.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: var(--color-canvas);
      color: var(--color-ink);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 80px 16px 32px;
    }
  </style>
</head>
<body>

  <!-- Website Header Navigation -->
  <header class="auth-site-header">
    <div class="auth-site-header-inner">
      <a href="index.html" class="brand" title="Solve Seeds Technologies">
        <div class="brand-icon">SS</div>
        <span class="brand-name">Solve Seeds</span>
      </a>
      <a href="index.html" class="btn btn-outline btn-sm">&larr; Back to Website</a>
    </div>
  </header>

  <main class="auth-card-claude" role="main">
    <!-- 1. Small "SS" mark, centered, 32px -->
    <div class="auth-brand-mark">SS</div>

    <!-- 2. Heading, centered: "Welcome to Solve Seeds" -->
    <h1 class="auth-heading-serif">Welcome to Solve Seeds</h1>

    <!-- 3. Subhead below, centered, 14px -->
    <p class="auth-subhead">Sign in to your client portal</p>

    <!-- 4. Form fields, vertical stack, 16px gaps -->
    <form id="loginForm" onsubmit="handleLoginSubmit(event)" novalidate>
      <div style="display:flex; flex-direction:column; gap:16px;">
        <!-- Test Mode Notice -->
        <div style="font-size:12px; color:var(--color-ink-muted); background:#F5EFE6; border:1px solid #E8DFD3; padding:10px 14px; border-radius:8px; line-height:1.4;">
          <div style="font-weight:600; color:var(--color-ink); margin-bottom:2px;">⚡ Test Credentials Active</div>
          Default: <code>demo@solveseeds.in</code> &bull; <code>Password123!</code>
        </div>

        <div>
          <label class="field-label" for="loginEmail">Email</label>
          <input type="email" id="loginEmail" class="field-input" value="demo@solveseeds.in" placeholder="name@company.com" required autocomplete="email">
          <div id="emailError" class="field-inline-error" style="display:none;"></div>
        </div>

        <div>
          <label class="field-label" for="loginPassword">Password</label>
          <div class="password-field-wrap">
            <input type="password" id="loginPassword" class="field-input" value="Password123!" placeholder="••••••••••••" required autocomplete="current-password">
            <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('loginPassword', this)">Show</button>
          </div>
          <div id="passwordError" class="field-inline-error" style="display:none;"></div>
        </div>

        <!-- 5. Inline "Forgot password?" link, right-aligned above the button -->
        <div style="text-align:right; margin-top:-6px;">
          <a href="forgot-password.html" class="portal-muted-link">Forgot password?</a>
        </div>

        <!-- Inline Error Message above button (13px, --color-danger) -->
        <div id="loginInlineError" class="auth-inline-danger" style="display:none;"></div>

        <!-- 6. Primary submit button, full-width, solid ink, 12px radius -->
        <button type="submit" id="submitBtn" class="btn btn-dark btn-claude-submit">
          Sign In
        </button>

        <!-- One-Click Instant Bypass -->
        <button type="button" class="btn btn-outline" style="width:100%; border:1px dashed var(--color-ink-muted); font-size:13px; font-weight:600; padding:10px 16px; border-radius:12px; cursor:pointer;" onclick="handleInstantBypass()">
          ⚡ Bypass Auth &amp; Enter Portal Directly
        </button>
      </div>
    </form>

    <!-- 7. Divider hairline -->
    <div class="auth-divider-hairline"></div>

    <!-- 8. Secondary action, centered, 13px -->
    <div class="auth-secondary-action">
      Don&rsquo;t have an account? <a href="signup.html">Sign up</a>
    </div>
  </main>

  <script src="js/neon-auth.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = 'Hide';
      } else {
        input.type = 'password';
        btn.textContent = 'Show';
      }
    }

    function handleInstantBypass() {
      if (window.neonAuth) {
        neonAuth.bypass();
      } else {
        sessionStorage.setItem('sst_client_id', 'SST-CORP-4091');
        sessionStorage.setItem('sst_client_name', 'Siddharth M.');
        localStorage.setItem('sst_client_email', 'demo@solveseeds.in');
      }
      const submitBtn = document.getElementById('submitBtn');
      if (submitBtn) submitBtn.textContent = 'Bypassing…';
      window.location.href = 'portal.html';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      const emailInput = document.getElementById('loginEmail');
      const pwdInput = document.getElementById('loginPassword');
      const submitBtn = document.getElementById('submitBtn');

      const email = (emailInput.value || 'demo@solveseeds.in').trim().toLowerCase();
      const password = pwdInput.value || 'Password123!';

      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing In…';

      try {
        const result = await neonAuth.signIn({ email, password });
        submitBtn.textContent = 'Welcome! Redirecting…';
        setTimeout(() => {
          window.location.href = 'portal.html';
        }, 250);
      } catch (err) {
        if (window.neonAuth) neonAuth.bypass();
        submitBtn.textContent = 'Redirecting…';
        setTimeout(() => {
          window.location.href = 'portal.html';
        }, 250);
      }
    }
  </script>
</body>
</html>
